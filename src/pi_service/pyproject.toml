[project]
name = "zbot-pi-service"
version = "0.1.0"
description = "Pi-side intent service for the Zeroth-01: executes demos locally against the servo bus; web clients send high-level intents only (never per-cycle setpoints over Wi-Fi)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "zbot-core",
]

[tool.uv.sources]
zbot-core = { path = "../zbot_core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
