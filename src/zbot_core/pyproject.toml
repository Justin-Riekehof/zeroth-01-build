[project]
name = "zbot-core"
version = "0.1.0"
description = "Shared core for the Zeroth-01 build: serial bus layer, configs, motion/demo engine — used by the local servo GUI (Windows/COMx) and the Pi service (Linux //dev/tty*)"
requires-python = ">=3.12"
dependencies = [
    "ftservo-python-sdk>=2.0.0",
    "pyserial>=3.5",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zbot_core"]
