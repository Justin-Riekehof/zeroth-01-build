<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeroth-01 CAD viewer</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three-0.160.1/three.module.js", "three/addons/": "./vendor/three-0.160.1/addons/" } }
</script>
<style>
  :root { --bg:#12151b; --panel:#1b2029; --line:#2a313d; --fg:#d8dee9; --mut:#8a94a6; --acc:#ffb020; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  body { display:grid; grid-template-columns: 320px 1fr; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside header { padding:10px 12px; border-bottom:1px solid var(--line); }
  aside header a { color:var(--mut); text-decoration:none; font-size:12px; }
  h1 { font-size:14px; margin:0 0 6px; }
  input[type=search] { width:100%; padding:6px 8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid var(--line); }
  button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); }
  #list { overflow:auto; flex:1; padding:4px 0; }
  .row { display:flex; align-items:center; gap:6px; padding:2px 12px; cursor:pointer; white-space:nowrap; }
  .row:hover { background:#232a36; }
  .row.sel { background:#3a2f12; color:var(--acc); }
  .row.off { opacity:.4; }
  .row .sw { width:10px; height:10px; border-radius:2px; flex:none; border:1px solid #0008; }
  .row .nm { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .row .eye { opacity:.6; }
  #info { border-top:1px solid var(--line); padding:10px 12px; min-height:120px; font-size:12px; }
  #info b { color:var(--acc); }
  #info table { border-collapse:collapse; margin-top:4px; }
  #info td { padding:1px 10px 1px 0; color:var(--mut); } #info td+td { color:var(--fg); }
  main { position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  #tip { position:absolute; pointer-events:none; background:#000c; padding:3px 7px; border-radius:4px; font-size:12px; display:none; }
  #hint { position:absolute; right:12px; bottom:10px; color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Zeroth-01 CAD viewer <span id="cnt" style="color:var(--mut);font-weight:400"></span></h1>
    <input type="search" id="q" placeholder="search part…">
    <div style="margin-top:6px"><a href="./">← servo GUI</a></div>
  </header>
  <div class="tools">
    <button id="bIso" title="Show only the selected part (I)">isolate</button>
    <button id="bHide" title="Hide the selected part (H)">hide</button>
    <button id="bAll" title="Show everything (A)">show all</button>
    <button id="bGhost" title="Make the other parts transparent (G)">ghost others</button>
    <button id="bFit" title="Fit view (F)">fit</button>
  </div>
  <div id="list"></div>
  <div id="info"><span style="color:var(--mut)">Click a part in the 3D view or the list.</span></div>
</aside>
<main>
  <canvas id="c"></canvas>
  <div id="tip"></div>
  <div id="hint">left: rotate · right: pan · wheel: zoom · double-click: focus part</div>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x12151b);
const camera = new THREE.PerspectiveCamera(35, 1, 0.005, 20);
camera.position.set(0.5, 0.35, 0.7);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 1.5); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.6); dl2.position.set(-1, 0.5, -1); scene.add(dl2);
scene.add(new THREE.GridHelper(1, 20, 0x2a313d, 0x1e242e));

const root = new THREE.Group(); root.rotation.x = -Math.PI / 2;   // GLB is Z-up
scene.add(root);

const parts = [];            // {mesh, name, row, color}
let selected = null, ghost = false, isolated = false;
const SEL = new THREE.Color(0xffb020);

// the part is the named glTF node (OnShape part); nodes with several primitives become a group of
// generic 'mesh N' children, which all belong to the same part
function partNode(mesh) {
  for (let o = mesh; o; o = o.parent) if (o.name && !/^(mesh[ _\d]*|Scene|Sketchfab.*|RootNode)$/i.test(o.name)) return o;
  return mesh;
}
const pretty = n => n.replace(/_[0-9a-f]{6}$/, '').replace(/_/g, ' ');

new GLTFLoader().load('./model', gltf => {
  root.add(gltf.scene);
  const byNode = new Map();
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.material = o.material.clone();
    o.material.side = THREE.DoubleSide;
    const node = partNode(o);
    let p = byNode.get(node);
    if (!p) { p = { node, name: node.name || 'part', meshes: [], color: o.material.color.clone(), opacity: o.material.opacity }; byNode.set(node, p); parts.push(p); }
    p.meshes.push(o); o.userData.part = p;
  });
  root.updateMatrixWorld(true);
  parts.sort((a, b) => a.name.localeCompare(b.name));
  buildList(); fit(); $('cnt').textContent = `· ${parts.length} parts`;
}, undefined, e => { $('info').textContent = 'Model load failed: ' + e.message; });

function buildList() {
  const L = $('list'); L.innerHTML = '';
  for (const p of parts) {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span class="sw" style="background:#${p.color.getHexString()}"></span><span class="nm"></span><span class="eye">👁</span>`;
    r.querySelector('.nm').textContent = pretty(p.name); r.title = p.name;
    r.onclick = e => { if (e.target.classList.contains('eye')) toggle(p); else select(p); };
    r.ondblclick = () => focus(p);
    p.row = r; L.appendChild(r);
  }
}
$('q').oninput = () => {
  const s = $('q').value.toLowerCase();
  for (const p of parts) p.row.style.display = p.name.toLowerCase().includes(s) ? '' : 'none';
};

const vis = (p, v) => { for (const m of p.meshes) m.visible = v; p.row.classList.toggle('off', !v); };
function toggle(p) { vis(p, !p.meshes[0].visible); }
function paint() {
  for (const p of parts) {
    const isSel = p === selected, t = ghost && !isSel;
    for (const mesh of p.meshes) {
      const m = mesh.material;
      m.color.copy(isSel ? SEL : p.color);
      m.emissive?.set(isSel ? 0x5a3a00 : 0x000000);
      m.transparent = t || p.opacity < 1; m.opacity = t ? 0.12 : p.opacity; m.depthWrite = !t;
    }
    p.row.classList.toggle('sel', isSel);
  }
}
function select(p) {
  selected = p; paint();
  if (!p) { $('info').innerHTML = '<span style="color:var(--mut)">Click a part in the 3D view or the list.</span>'; return; }
  p.row.scrollIntoView({ block: 'nearest' });
  const box = partBox(p), sz = box.getSize(new THREE.Vector3()).multiplyScalar(1000);
  const c = box.getCenter(new THREE.Vector3()).multiplyScalar(1000);
  // robot frame (Z-up): three (x,y,z) of the model group -> robot (x, -z, y) after the root rotation; the world box
  // is already in three space, so convert back to the CAD frame for the readout
  const cc = { x: c.x, y: -c.z, z: c.y };
  const tris = p.meshes.reduce((a, m) => a + (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3, 0);
  const vol = p.meshes.reduce((a, m) => a + meshVolume(m), 0) * 1e6;   // m³ -> cm³
  $('info').innerHTML = `<b>${pretty(p.name)}</b><table>
    <tr><td>node</td><td>${p.name}</td></tr>
    <tr><td>size (mm)</td><td>${sz.x.toFixed(1)} × ${sz.z.toFixed(1)} × ${sz.y.toFixed(1)} (x·y·z)</td></tr>
    <tr><td>centre (mm)</td><td>${cc.x.toFixed(1)}, ${cc.y.toFixed(1)}, ${cc.z.toFixed(1)}</td></tr>
    <tr><td>triangles</td><td>${tris}</td></tr>
    <tr><td>volume</td><td>${Number.isFinite(vol) ? vol.toFixed(2) + ' cm³ (open meshes: approx.)' : '–'}</td></tr>
    <tr><td>colour</td><td>#${p.color.getHexString()}</td></tr></table>`;
}
function partBox(p) { const b = new THREE.Box3(); for (const m of p.meshes) b.expandByObject(m); return b; }
function meshVolume(mesh) {
  const g = mesh.geometry, pos = g.attributes.position, idx = g.index;
  mesh.updateWorldMatrix(true, false);
  const s = mesh.matrixWorld.getMaxScaleOnAxis(); let v = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const n = idx ? idx.count : pos.count;
  for (let i = 0; i < n; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
    v += a.dot(b.cross(c)) / 6;
  }
  return Math.abs(v) * s ** 3;
}

function focus(p) {
  const box = partBox(p), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length() * 1.2, 0.03);
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c); camera.position.copy(c).addScaledVector(dir, r * 1.8);
}
function fit() {
  const box = new THREE.Box3();
  for (const p of parts) if (p.meshes[0].visible) box.union(partBox(p));
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.6, 0.35, 0.9).normalize().multiplyScalar(r * 1.3));
}

$('bIso').onclick = () => { if (!selected) return; isolated = true; for (const p of parts) vis(p, p === selected); };
$('bHide').onclick = () => { if (selected) toggle(selected); };
$('bAll').onclick = () => { isolated = false; for (const p of parts) vis(p, true); };
$('bGhost').onclick = () => { ghost = !ghost; $('bGhost').style.borderColor = ghost ? 'var(--acc)' : ''; paint(); };
$('bFit').onclick = fit;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const id = { i: 'bIso', h: 'bHide', a: 'bAll', g: 'bGhost', f: 'bFit' }[e.key];
  if (id) $(id).click();
  if (e.key === 'Escape') select(null);
});

// picking: a click (not a drag) selects the nearest visible part
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(parts.filter(p => p.meshes[0].visible).flatMap(p => p.meshes), false)[0];
  return hit?.object.userData.part ?? null;
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  select(pickAt(e));
});
canvas.addEventListener('dblclick', e => { const p = pickAt(e); if (p) focus(p); });
const tip = $('tip');
canvas.addEventListener('pointermove', e => {
  if (e.buttons) { tip.style.display = 'none'; return; }
  const p = pickAt(e);
  if (!p) { tip.style.display = 'none'; return; }
  const r = canvas.parentElement.getBoundingClientRect();
  tip.textContent = pretty(p.name); tip.style.display = 'block';
  tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
}
renderer.setAnimationLoop(() => { resize(); controls.update(); renderer.render(scene, camera); });
window.__cad = { parts, select, THREE };
</script>
</body>
</html>
