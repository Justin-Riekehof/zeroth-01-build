[project]
name = "zeroth-01-servo-gui"
version = "0.1.0"
description = "Single-servo test GUI with 3D CAD visualization for the Zeroth-01 build"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "zbot-core",
]

[tool.uv.sources]
zbot-core = { path = "../zbot_core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["suites"]
